services:
  - type: web
    name: droplet-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python ../ml/train.py

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "15444"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: MYSQL_SSL_CA
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: MODEL_PATH
        value: /opt/render/project/src/ml/models/water_potability_model.joblib
